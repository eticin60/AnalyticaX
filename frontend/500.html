<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>500 — Internal Server Error | AnalyticaX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --neon:#00E5FF;
  --magenta:#FF4DFF;
  --green:#14F195;
  --bg:#020617;
  --panel:#0b1020;
  --text-soft:#98A0B3;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Poppins, sans-serif;
  background:radial-gradient(circle at top,#071526 0,var(--bg) 45%,#000 100%);
  overflow:hidden;
  color:#fff;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* BACKGROUND */
canvas#particles{position:fixed;inset:0;z-index:-3;}
.bg-grid{
  position:fixed;inset:0;
  background-image:
    linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(255,255,255,.03) 1px,transparent 1px);
  opacity:.22;pointer-events:none;z-index:-2;
}
.bg-glow{
  position:fixed;width:520px;height:520px;border-radius:50%;
  filter:blur(150px);
  opacity:.7;mix-blend-mode:screen;z-index:-1;
  animation:float 16s ease-in-out infinite alternate;
}
.bg-glow.c1{background:radial-gradient(circle,rgba(0,229,255,.9),transparent 60%);top:-120px;left:-130px;}
.bg-glow.c2{background:radial-gradient(circle,rgba(255,77,255,.9),transparent 60%);bottom:-130px;right:-120px;}

@keyframes float{
  0%{transform:translate(0,0);}
  100%{transform:translate(50px,-35px);}
}

/* CONTENT */
.box{
  position:relative;z-index:5;
  width:90%;max-width:650px;
  padding:30px;
}

.logo{
  width:120px;
  filter:drop-shadow(0 0 20px rgba(0,229,255,.75));
  margin-bottom:15px;
}

.title{
  font-size:110px;
  font-weight:700;
  background:linear-gradient(90deg,var(--neon),var(--magenta));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

.subtitle{
  font-size:24px;
  font-weight:600;
  margin-bottom:12px;
}

.desc{
  color:var(--text-soft);
  font-size:14px;
  margin-bottom:28px;
}

.btn{
  padding:12px 28px;
  background:linear-gradient(90deg,var(--neon),var(--magenta));
  color:#020617;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,229,255,.7);
  border:none;
}
.btn:hover{transform:scale(1.05);}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<div class="bg-grid"></div>
<div class="bg-glow c1"></div>
<div class="bg-glow c2"></div>

<div class="box">
  <img src="assets/AnalyticaX.png" class="logo">
  <div class="title">500</div>
  <div class="subtitle">Internal Server Error</div>
  <div class="desc">
    Something went wrong on our side.  
    Our engineers have been notified automatically.
  </div>
  <button class="btn" onclick="location.href='index.html'">Return Home</button>
</div>

<script>
const c=document.getElementById("particles");
const ctx=c.getContext("2d");
let p=[];

function r(){c.width=innerWidth;c.height=innerHeight;}
r();onresize=r;

for(let i=0;i<70;i++){
  p.push({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*2+1,
    vx:(Math.random()-0.5)*0.3,
    vy:(Math.random()-0.5)*0.3
  });
}

function d(){
  ctx.clearRect(0,0,c.width,c.height);
  p.forEach(o=>{
    o.x+=o.vx;o.y+=o.vy;
    if(o.x<0)o.x=c.width;
    if(o.x>c.width)o.x=0;
    if(o.y<0)o.y=c.height;
    if(o.y>c.height)o.y=0;
    ctx.fillStyle="rgba(0,229,255,.45)";
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
  });
  requestAnimationFrame(d);
}
d();
</script>
</body>
</html>
