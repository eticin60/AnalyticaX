<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnalyticaX – Register | Sign Up</title>
<meta name="description" content="Create your AnalyticaX account - AI-powered cryptocurrency and stock chart analysis platform." />
<meta name="keywords" content="register, sign up, create account, crypto analysis account, AnalyticaX register" />
<meta name="robots" content="index, follow" />

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://analyticax.com.tr/register.html" />
<meta property="og:title" content="AnalyticaX – Register" />
<meta property="og:description" content="Create your AnalyticaX account for AI-powered chart analysis." />
<meta property="og:image" content="https://analyticax.com.tr/assets/AnalyticaX.png" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="AnalyticaX – Register" />
<meta name="twitter:description" content="Create your AnalyticaX account." />
<meta name="twitter:image" content="https://analyticax.com.tr/assets/AnalyticaX.png" />

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        overflow: hidden;
        background: radial-gradient(circle at top, #1b1f3a, #000014);
        position: relative;
        color: #fff;
    }

    /* NAVBAR */
    .navbar{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      width:calc(100% - 80px);
      max-width:1400px;
      padding:14px 32px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:0;
      backdrop-filter:blur(20px) saturate(180%);
      background:rgba(15,10,25,0.7);
      border:none;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      z-index:50;
      border-radius:16px;
      margin:0;
    }
    .navbar .nav-brand{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      margin:0;
      z-index:10;
      cursor:pointer;
    }
    .nav-brand{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      cursor:pointer;
      transition:all 0.3s ease;
      padding:16px 20px 14px;
      background:linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,41,59,0.7));
      border:1px solid rgba(0,229,255,0.4);
      border-radius:16px;
      box-shadow:0 8px 32px rgba(0,229,255,0.3), 0 0 60px rgba(255,77,255,0.2);
      backdrop-filter:blur(30px) saturate(180%);
    }
    .nav-brand:hover{
      transform:translateX(-50%) translateY(-2px);
      box-shadow:0 12px 40px rgba(0,229,255,0.4), 0 0 80px rgba(255,77,255,0.3);
      border-color:rgba(0,229,255,0.6);
    }
    .nav-brand img{
      height:80px;
      width:auto;
      object-fit:contain;
      filter:drop-shadow(0 0 15px rgba(0,229,255,0.5));
    }

    #particles {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 0 !important;
        pointer-events: none;
    }

    .login-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 420px;
        max-width: 90%;
        padding: 40px;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.85));
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(0,229,255,0.3);
        box-shadow: 0 8px 32px rgba(0,229,255,0.3), 0 0 60px rgba(255,77,255,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
        z-index: 3;
        animation: fadeIn 1.2s ease;
    }

    .login-card h2 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .login-card input {
        width: 100%;
        padding: 14px 16px;
        margin: 12px 0;
        border-radius: 12px;
        outline: none;
        border: 1px solid rgba(0,229,255,0.2);
        background: rgba(15,23,42,0.6);
        color: #fff;
        font-size: 15px;
        box-sizing: border-box;
        transition: all 0.3s ease;
    }
    .login-card input:focus {
        border-color: rgba(0,229,255,0.6);
        background: rgba(15,23,42,0.8);
        box-shadow: 0 0 20px rgba(0,229,255,0.2);
    }
    .login-card input::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    .login-card button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #00E5FF, #FF4DFF);
        color: #020617;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(0,229,255,0.4), 0 0 40px rgba(255,77,255,0.3);
    }

    .login-card button:hover {
        box-shadow: 0 6px 30px rgba(0,229,255,0.6), 0 0 60px rgba(255,77,255,0.5);
        transform: translateY(-2px);
    }

    .login-card button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .register-link {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        opacity: 0.8;
    }

    .register-link a {
        color: #00c3ff;
        text-decoration: none;
        font-weight: 500;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    .neon-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(45deg, transparent, rgba(0,140,255,0.4), transparent);
        animation: neonMove 6s infinite linear;
    }

    @keyframes neonMove {
        0% { transform: translateX(-100%); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(100%); opacity: 0; }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translate(-50%, -45%); }
        to { opacity: 1; transform: translate(-50%, -50%); }
    }
</style>
<script src="js/api-config.js"></script>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-brand" onclick="window.location.href='index.html'">
    <img src="assets/AnalyticaX.png" alt="AnalyticaX Logo">
  </div>
</header>

<canvas id="particles"></canvas>

<div class="neon-glow"></div>

<div class="login-card">
    <h2>Create Account</h2>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <button onclick="registerUser()" id="registerBtn">Register</button>

    <div class="register-link">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>


<script>
// ==== PARTICLE BACKGROUND (Dashboard ile aynı) ====
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];
const PARTICLE_COUNT = 80;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function createParticles(){
  particles = [];
  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*2+0.5,
      vx:(Math.random()-0.5)*0.2,
      vy:(Math.random()-0.5)*0.2,
      alpha: Math.random()*0.6+0.2
    });
  }
}
createParticles();

function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<0)p.x=canvas.width;
    if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;
    if(p.y>canvas.height)p.y=0;

    const gradient = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
    gradient.addColorStop(0,`rgba(0,229,255,${p.alpha})`);
    gradient.addColorStop(0.4,`rgba(255,77,255,${p.alpha*0.7})`);
    gradient.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*6,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();


async function registerUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const btn = document.getElementById("registerBtn");

    if (!email || !password) {
        alert("Please enter both email and password.");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return;
    }

    const originalText = btn.textContent;
    btn.textContent = "Registering...";
    btn.disabled = true;

    try {
        const API_BASE = window.API_BASE || 'https://analyticax-production.up.railway.app';
        let res = await fetch(`${API_BASE}/api/auth/register`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ email, password })
        });

        let data;
        try {
            data = await res.json();
        } catch (e) {
            console.error("JSON parse error:", e);
            alert("Server error. Please check your connection.");
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }

        console.log("REGISTER RESPONSE:", data);

        if (!res.ok || !data.ok) {
            alert(data.message || data.error || "Registration failed. Please try again.");
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }

        if (data.token) {
            localStorage.setItem("ax_token", data.token);
            alert("Registration successful! Redirecting...");
            window.location.href = "dashboard.html";
        } else {
            alert("Registration successful! Please login.");
            window.location.href = "login.html";
        }

    } catch (err) {
        console.error("Register error:", err);
        alert("Connection error: " + err.message + "\n\nPlease check your connection and try again.");
        btn.textContent = originalText;
        btn.disabled = false;
    }
}

// Allow Enter key to submit
document.getElementById("password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        registerUser();
    }
});
</script>

</body>
</html>
