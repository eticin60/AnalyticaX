<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Payment — AnalyticaX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --neon:#00E5FF;
      --magenta:#FF4DFF;
      --accent-green:#14F195;
      --bg:#020617;
      --panel:#0b1020;
      --text-soft:#A0AEC0;
      --border-soft:rgba(148,163,184,.35);
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:"Poppins",sans-serif;
      background:radial-gradient(circle at top,#061525 0,var(--bg) 45%,#000 100%);
      color:#fff;
      min-height:100vh;
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .verify-card{
      background:rgba(15,23,42,.96);
      border-radius:24px;
      padding:32px;
      border:1px solid var(--border-soft);
      box-shadow:0 26px 60px rgba(15,23,42,.95);
      max-width:500px;
      width:100%;
    }

    .verify-title{
      font-size:24px;
      font-weight:600;
      background:linear-gradient(90deg,var(--neon),var(--magenta));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:8px;
    }

    .verify-subtitle{
      font-size:13px;
      color:var(--text-soft);
      margin-bottom:24px;
    }

    .form-group{
      margin-bottom:20px;
    }

    .form-label{
      font-size:12px;
      color:var(--text-soft);
      margin-bottom:8px;
      display:block;
    }

    .form-input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid rgba(148,163,184,.5);
      background:rgba(0,0,0,.4);
      color:#fff;
      font-size:13px;
      font-family:monospace;
    }

    .form-input:focus{
      outline:none;
      border-color:var(--neon);
      box-shadow:0 0 15px rgba(0,229,255,.3);
    }

    .btn-verify{
      width:100%;
      padding:14px;
      border-radius:999px;
      border:none;
      background:linear-gradient(90deg,var(--neon),var(--magenta));
      color:#020617;
      font-weight:600;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 0 25px rgba(0,229,255,.6);
      transition:all 0.3s ease;
      margin-top:12px;
    }

    .btn-verify:hover{
      box-shadow:0 0 35px rgba(0,229,255,.9);
      transform:translateY(-2px);
    }

    .btn-verify:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }

    .info-box{
      background:rgba(15,23,42,.7);
      border-radius:12px;
      padding:12px;
      margin-bottom:16px;
      font-size:12px;
      color:var(--text-soft);
      border:1px solid rgba(148,163,184,.3);
    }

    .loading-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.85);
      backdrop-filter:blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      flex-direction:column;
    }

    .loading-overlay.active{
      display:flex;
    }

    .loader{
      width:64px;
      height:64px;
      border:5px solid rgba(255,255,255,.15);
      border-top:5px solid var(--neon);
      border-right:5px solid var(--magenta);
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin-bottom:20px;
    }

    @keyframes spin{
      to{transform:rotate(360deg);}
    }

    .loading-text{
      font-size:16px;
      color:#fff;
    }

    .back-link{
      display:inline-block;
      margin-top:16px;
      color:var(--neon);
      text-decoration:none;
      font-size:12px;
    }

    .back-link:hover{
      text-decoration:underline;
    }
  </style>
  <script src="js/api-config.js"></script>
</head>
<body>
  <div class="verify-card">
    <h1 class="verify-title">Verify Payment</h1>
    <p class="verify-subtitle">Enter your transaction ID (TXID) to verify your payment and add credits to your account.</p>

    <div class="info-box">
      <strong>Plan:</strong> <span id="planName">—</span><br>
      <strong>Amount:</strong> <span id="planAmount">—</span><br>
      <strong>Credits:</strong> <span id="planCredits">—</span>
    </div>

    <form id="verifyForm">
      <div class="form-group">
        <label class="form-label" for="txid">Transaction ID (TXID)</label>
        <input type="text" id="txid" class="form-input" placeholder="Enter your transaction ID" required>
      </div>

      <button type="submit" class="btn-verify" id="btnVerify">Verify Payment</button>
    </form>

    <a href="premium.html" class="back-link">← Back to Premium Plans</a>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader"></div>
    <div class="loading-text" id="loadingText">Verifying Payment...</div>
  </div>

  <script>
    const API_BASE = window.API_BASE || 'https://analyticax.com.tr';
    const token = localStorage.getItem("ax_token");
    
    if(!token) {
      alert("Please login first");
      window.location.href = "login.html";
    }

    // Get plan info from URL or localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const planName = urlParams.get("plan") || localStorage.getItem("selectedPlanName") || "Pro pack";
    const planPrice = parseFloat(urlParams.get("price") || localStorage.getItem("selectedPlanPrice") || "50");
    const planCredits = parseInt(urlParams.get("credits") || localStorage.getItem("selectedPlanCredits") || "10");
    const paymentMethod = urlParams.get("method") || localStorage.getItem("selectedPaymentMethod") || "OXAPAY";

    document.getElementById("planName").textContent = planName;
    document.getElementById("planAmount").textContent = "$" + planPrice;
    document.getElementById("planCredits").textContent = planCredits;

    document.getElementById("verifyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const txid = document.getElementById("txid").value.trim();
      if(!txid) {
        alert("Please enter transaction ID");
        return;
      }

      const overlay = document.getElementById("loadingOverlay");
      const btn = document.getElementById("btnVerify");
      overlay.classList.add("active");
      btn.disabled = true;
      document.getElementById("loadingText").textContent = "Verifying Payment...";

      try {
        const res = await fetch(`${API_BASE}/api/payments/verify`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
            "x-device-id": localStorage.getItem("ax_device_id"),
            "x-device-fingerprint": localStorage.getItem("ax_fingerprint")
          },
          body: JSON.stringify({
            txid,
            planName,
            amount: planPrice,
            credits: planCredits,
            method: paymentMethod
          })
        });

        const data = await res.json();
        overlay.classList.remove("active");
        btn.disabled = false;

        if(data.ok) {
          if(data.status === "pending") {
            alert("✅ Payment submitted successfully! Your transaction is pending admin approval. You will receive credits once approved.");
          } else {
            alert("✅ Payment verified successfully! " + (data.credits || planCredits) + " credits added to your account.");
          }
          // Clear stored plan info
          localStorage.removeItem("selectedPlanName");
          localStorage.removeItem("selectedPlanPrice");
          localStorage.removeItem("selectedPlanCredits");
          localStorage.removeItem("selectedPaymentMethod");
          // Redirect to premium page
          window.location.href = "premium.html?verified=1";
        } else {
          alert("❌ Verification failed: " + (data.error || data.message || "Please check your TXID"));
        }
      } catch(err) {
        overlay.classList.remove("active");
        btn.disabled = false;
        console.error("Verify error:", err);
        alert("Error: " + err.message);
      }
    });
  </script>
</body>
</html>
