<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    html {
        overflow-x: hidden;
        max-width: 100vw;
        width: 100%;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        height: 100vh;
        overflow-x: hidden !important;
        overflow-y: auto;
        background: radial-gradient(circle at top, #1b1f3a, #000014);
        position: relative;
        color: #fff;
        width: 100%;
        max-width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* NAVBAR - Hidden, only logo visible */
    .navbar{
      display:none !important;
      visibility:hidden !important;
    }
    .nav-brand{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      cursor:pointer;
      transition:all 0.3s ease;
      padding:12px 16px 10px;
      background:linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,41,59,0.7));
      border:1px solid rgba(0,229,255,0.4);
      border-radius:16px;
      box-shadow:0 8px 32px rgba(0,229,255,0.3), 0 0 60px rgba(255,77,255,0.2);
      backdrop-filter:blur(30px) saturate(180%);
      z-index:100;
      margin:0;
      width:auto;
      max-width:calc(100% - 40px);
    }
    .nav-brand:hover{
      transform:translateX(-50%) translateY(-2px);
      box-shadow:0 12px 40px rgba(0,229,255,0.4), 0 0 80px rgba(255,77,255,0.3);
      border-color:rgba(0,229,255,0.6);
    }
    .nav-brand img{
      height:60px;
      width:auto;
      max-width:100%;
      object-fit:contain;
      filter:drop-shadow(0 0 15px rgba(0,229,255,0.5));
}

#particles {
    position: fixed !important;
    top: 0;
    left: 0;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 0 !important;
    pointer-events: none;
}


    .login-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 420px;
        max-width: calc(100% - 40px);
        padding: 40px;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(30,41,59,0.85));
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(0,229,255,0.3);
        box-shadow: 0 8px 32px rgba(0,229,255,0.3), 0 0 60px rgba(255,77,255,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
        z-index: 3;
        animation: fadeIn 1.2s ease;
        box-sizing: border-box;
    }

    .login-card h2 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .login-card input {
        width: 100%;
        padding: 14px 16px;
        margin: 12px 0;
        border-radius: 12px;
        outline: none;
        border: 1px solid rgba(0,229,255,0.2);
        background: rgba(15,23,42,0.6);
        color: #fff;
        font-size: 15px;
        box-sizing: border-box;
        transition: all 0.3s ease;
    }
    .login-card input:focus {
        border-color: rgba(0,229,255,0.6);
        background: rgba(15,23,42,0.8);
        box-shadow: 0 0 20px rgba(0,229,255,0.2);
    }
    .login-card input::placeholder {
        color: rgba(255,255,255,0.5);
    }

    .login-card button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #00E5FF, #FF4DFF);
        color: #020617;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(0,229,255,0.4), 0 0 40px rgba(255,77,255,0.3);
    }

    .login-card button:hover {
        box-shadow: 0 6px 30px rgba(0,229,255,0.6), 0 0 60px rgba(255,77,255,0.5);
        transform: translateY(-2px);
    }
    .login-card button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .register-link {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        opacity: 0.8;
    }

    .register-link a {
        color: #00c3ff;
        text-decoration: none;
        font-weight: 500;
    }

    .logo {
        position: absolute;
        right: 20px;
        top: 20px;
        width: 180px;
        z-index: 5;
    }

    .neon-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(45deg, transparent, rgba(0,140,255,0.4), transparent);
        animation: neonMove 6s infinite linear;
    }

    @keyframes neonMove {
        0% { transform: translateX(-100%); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(100%); opacity: 0; }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translate(-50%, -45%); }
        to { opacity: 1; transform: translate(-50%, -50%); }
    }
    
    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
        html, body {
            overflow-x: hidden !important;
            overflow-y: auto;
            height: auto;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 80px;
        }
        
        .nav-brand {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 14px 8px;
            max-width: calc(100% - 30px);
            width: auto;
        }
        
        .nav-brand img {
            height: 50px;
        }
        
        .login-card {
            position: relative;
            top: auto;
            left: auto;
            transform: none;
            width: calc(100% - 30px);
            max-width: 400px;
            margin: 0 auto 40px;
            padding: 30px 24px;
        }
        
        .login-card h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }
        
        .login-card input {
            padding: 12px 14px;
            font-size: 14px;
            width: 100%;
        }
        
        .login-card button {
            padding: 12px;
            font-size: 15px;
            width: 100%;
        }
        
        #particles {
            position: fixed;
            width: 100vw;
            height: 100vh;
            left: 0;
            right: 0;
        }
    }
    
    @media (max-width: 480px) {
        html, body {
            overflow-x: hidden !important;
            width: 100%;
            max-width: 100vw;
        }
        
        body {
            padding-top: 70px;
        }
        
        .nav-brand {
            top: 10px;
            padding: 8px 12px 6px;
            max-width: calc(100% - 20px);
        }
        
        .nav-brand img {
            height: 40px;
        }
        
        .login-card {
            width: calc(100% - 20px);
            max-width: 100%;
            margin: 0 auto 30px;
            padding: 24px 20px;
            border-radius: 16px;
        }
        
        .login-card h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }
        
        .login-card input {
            padding: 11px 12px;
            font-size: 14px;
            margin: 10px 0;
            width: 100%;
        }
        
        .login-card button {
            padding: 11px;
            font-size: 14px;
            margin-top: 16px;
            width: 100%;
        }
        
        .register-link {
            font-size: 13px;
            margin-top: 12px;
        }
    }
</style>
<script src="js/api-config.js"></script>
</head>

<body>

<!-- LOGO ONLY (Navbar Hidden) -->
<div class="nav-brand" onclick="window.location.href='index.html'">
    <img src="assets/AnalyticaX.png" alt="AnalyticaX Logo">
</div>

<canvas id="particles"></canvas>

<div class="neon-glow"></div>

<div class="login-card">
    <h2>Login to AnalyticaX</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="loginUser()">Login</button>

    <div class="register-link">
        No account? <a href="register.html">Register</a>
    </div>
</div>


<script>
// ==== PARTICLE BACKGROUND (Dashboard ile aynı) ====
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];
const PARTICLE_COUNT = 80;

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function createParticles(){
  particles = [];
  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*2+0.5,
      vx:(Math.random()-0.5)*0.2,
      vy:(Math.random()-0.5)*0.2,
      alpha: Math.random()*0.6+0.2
    });
    }
}
createParticles();

function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<0)p.x=canvas.width;
    if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;
    if(p.y>canvas.height)p.y=0;

    const gradient = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
    gradient.addColorStop(0,`rgba(0,229,255,${p.alpha})`);
    gradient.addColorStop(0.4,`rgba(255,77,255,${p.alpha*0.7})`);
    gradient.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = gradient;
        ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*6,0,Math.PI*2);
        ctx.fill();
    }
  requestAnimationFrame(drawParticles);
}
drawParticles();

async function loginUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("Please enter both email and password.");
        return;
    }

    const btn = document.querySelector(".login-card button");
    const originalText = btn.textContent;
    btn.textContent = "Logging in...";
    btn.disabled = true;

    try {
        let deviceId = localStorage.getItem("ax_device_id");
        let deviceFingerprint = localStorage.getItem("ax_fingerprint");

        if (!deviceId) {
            deviceId = crypto.randomUUID();
            localStorage.setItem("ax_device_id", deviceId);
        }

        if (!deviceFingerprint) {
            deviceFingerprint = btoa(navigator.userAgent + navigator.language + screen.width + screen.height).substring(0,32);
            localStorage.setItem("ax_fingerprint", deviceFingerprint);
        }

        console.log("Attempting login...", { email, deviceId, deviceFingerprint });
        console.log("🌐 API_BASE:", window.API_BASE);
        console.log("📍 Current URL:", window.location.href);

        const API_BASE = window.API_BASE || 'https://analyticax-production.up.railway.app';
        const loginUrl = `${API_BASE}/api/auth/login`;
        console.log("🔗 Login URL:", loginUrl);
        
        // Add timeout to fetch request
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
        
        let res;
        try {
            res = await fetch(loginUrl, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password,
                    deviceId,
                    deviceFingerprint
                }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
        } catch (fetchError) {
            clearTimeout(timeoutId);
            if (fetchError.name === 'AbortError') {
                console.error("Request timeout");
                alert("Request timeout: Backend is not responding. Please check if the server is running.\n\nIf this persists, check Railway logs.");
            } else if (fetchError.message.includes('Failed to fetch') || fetchError.message.includes('NetworkError')) {
                console.error("Network error:", fetchError);
                alert("Network error: Cannot connect to backend server.\n\nPossible causes:\n- Backend is not running\n- CORS issue\n- Network connectivity problem\n\nCheck Railway deployment status.");
            } else {
                console.error("Fetch error:", fetchError);
                alert("Connection error: " + fetchError.message);
            }
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }

        console.log("Response status:", res.status);
        console.log("Response statusText:", res.statusText);
        console.log("Response URL:", res.url);
        console.log("Response headers:", Object.fromEntries(res.headers.entries()));

        // Check if response is ok before parsing
        if (!res.ok) {
            let errorText = "";
            let errorDetails = "";
            try {
                const errorData = await res.json();
                errorText = errorData.message || errorData.error || `HTTP ${res.status}: ${res.statusText}`;
                errorDetails = errorData.error || "";
                console.error("Login error response:", errorData);
            } catch (e) {
                const responseText = await res.text();
                errorText = `HTTP ${res.status}: ${res.statusText}`;
                errorDetails = responseText.substring(0, 200);
                console.error("Error response text:", responseText);
            }
            
            let alertMessage = `Login failed: ${errorText}`;
            if (res.status === 0 || res.status === 404) {
                alertMessage += "\n\n⚠️ Backend server not found. Check if Railway deployment is running.";
            } else if (res.status === 500) {
                alertMessage += "\n\n⚠️ Server error. Check Railway logs for details.";
            } else if (res.status === 401 || res.status === 403) {
                alertMessage += "\n\n⚠️ Invalid credentials or unauthorized access.";
            }
            
            alert(alertMessage);
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }

        let data;
        try {
            data = await res.json();
        } catch (e) {
            console.error("JSON parse error:", e);
            const responseText = await res.text();
            console.error("Response text:", responseText);
            alert(`Server error: Invalid response from server.\n\nStatus: ${res.status}\nPlease check if the backend is running.`);
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }

        console.log("Response data:", data);

        if (data.otpRequired) {
            localStorage.setItem("pending_email", email);
            btn.textContent = originalText;
            btn.disabled = false;
            window.location.href = "otp.html";
            return;
        }

        if (!data.ok) {
            const errorMsg = data.message || data.error || "Login failed. Please check your credentials.";
            console.error("Login failed:", errorMsg);
            alert(errorMsg);
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }

        if (!data.token) {
            console.error("Login failed: No token received");
            alert("Login failed: No token received from server.");
            btn.textContent = originalText;
            btn.disabled = false;
            return;
        }

        // Save token and device info
        localStorage.setItem("ax_token", data.token);
        console.log("✅ Login successful! Token saved.");
        
        // Don't show alert, just redirect
        window.location.href = "dashboard.html";
    } catch (error) {
        console.error("Login error:", error);
        alert("Network error: " + error.message + "\n\nPlease check your connection.");
        btn.textContent = originalText;
        btn.disabled = false;
    }
}

</script>

</body>
