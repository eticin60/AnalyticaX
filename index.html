<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnalyticaX – Yapay Zekâ Kripto Grafik Analizi</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --neon: #00e5ff;
      --magenta: #ff4dff;
      --bg-dark: #020617;
      --panel: #0b1020;
      --panel-soft: #111827;
      --text-soft: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #04101f 0, #020617 45%, #000 100%);
      color: #ffffff;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ===== BACKGROUND GRID & GLOWS ===== */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(
          to right,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px
        ),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
      z-index: -2;
    }

    .bg-glow {
      position: fixed;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.65;
      pointer-events: none;
      z-index: -1;
      mix-blend-mode: screen;
      animation: float 18s ease-in-out infinite alternate;
    }

    .bg-glow.cyan {
      background: radial-gradient(circle, rgba(0, 229, 255, 0.9), transparent 60%);
      top: -80px;
      left: -60px;
    }

    .bg-glow.magenta {
      background: radial-gradient(circle, rgba(255, 77, 255, 0.9), transparent 60%);
      bottom: -120px;
      right: -50px;
      animation-delay: 5s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(40px, -30px);
      }
    }

    /* ===== NAVBAR ===== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(14px);
      background: linear-gradient(to bottom, rgba(3, 7, 18, 0.88), rgba(3, 7, 18, 0.35));
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 50;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: contain;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.12), transparent 70%);
      padding: 3px;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
    }

    .logo-text-main {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
